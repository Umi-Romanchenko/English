<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Тренажёр английского · Веб-разработка</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: #0e1116; color: #e8ecf3; min-height: 100vh;
    overscroll-behavior-y: none; padding-bottom: 40px;
  }
  [hidden] { display: none !important; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 0 14px; }

  header {
    position: sticky; top: 0; z-index: 20;
    background: rgba(14,17,22,.92);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid #1c222d; padding: 12px 14px 10px;
  }
  header .inner { max-width: 480px; margin: 0 auto; }
  h1 {
    font-size: 16px; margin: 0 0 10px; font-weight: 700;
    letter-spacing: .3px; color: #f1f5fb;
    display: flex; align-items: center; gap: 8px;
  }
  h1 .dot { width: 8px; height: 8px; border-radius: 50%; background: #4f8cff; box-shadow: 0 0 12px #4f8cff; }

  .tabs { display: flex; gap: 6px; background: #151a23; padding: 4px; border-radius: 12px; }
  .tab {
    flex: 1; border: 0; background: transparent; color: #8b97a8;
    font-size: 13px; font-weight: 600; padding: 9px 6px; border-radius: 9px;
    transition: .2s; font-family: inherit;
  }
  .tab.active { background: #24304a; color: #fff; }

  .btn {
    border: 1px solid #2a3242; background: #161b24; color: #cfd7e4;
    font-family: inherit; font-size: 14px; font-weight: 600;
    padding: 12px 16px; border-radius: 12px; transition: .15s;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: linear-gradient(135deg,#3b7bff,#2f5fd8); border-color: #3b7bff; color: #fff; }
  .btn.ok { background: linear-gradient(135deg,#1f9d55,#188044); border-color: #22a35c; color: #fff; }
  .btn.bad { background: linear-gradient(135deg,#c93b3b,#a32c2c); border-color: #d14545; color: #fff; }
  .btn.ghost { background: #151a23; }
  .btn.big { width: 100%; padding: 16px; font-size: 16px; border-radius: 14px; }
  .btn:disabled { opacity: .4; }
  .row { display: flex; gap: 8px; }
  .row .btn { flex: 1; }

  h2 { font-size: 17px; margin: 18px 0 4px; font-weight: 700; }
  .hint { font-size: 12px; color: #6f7c90; margin: 4px 0 12px; }
  .hint.center { text-align: center; }

  .chips { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .chip {
    padding: 10px 11px; border-radius: 12px; border: 1px solid #232c3b;
    background: #151a23; color: #cfd7e4; font-family: inherit;
    display: flex; flex-direction: column; gap: 3px; text-align: left; transition: .15s;
  }
  .chip .n { font-weight: 700; font-size: 13px; }
  .chip .w { font-size: 10.5px; opacity: .55; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip.active { border-color: #4f8cff; background: #17233a; color: #fff; box-shadow: 0 0 0 1px #4f8cff inset; }
  .chip.active .w { opacity: .75; }

  .seg { display: flex; background: #151a23; border-radius: 12px; padding: 4px; gap: 4px; }
  .seg button {
    flex: 1; border: 0; background: transparent; color: #8b97a8;
    font-family: inherit; font-size: 12.5px; font-weight: 600;
    padding: 10px; border-radius: 9px; transition: .2s;
  }
  .seg button.active { background: #24304a; color: #fff; }

  .field { margin: 16px 0; }
  .field label { display: block; font-size: 12px; color: #6f7c90; margin-bottom: 6px; font-weight: 600; letter-spacing: .3px; }

  .topbar { display: flex; align-items: center; gap: 10px; margin: 12px 0 8px; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 10px; border: 1px solid #232c3b;
    background: #151a23; color: #cfd7e4; font-size: 18px; line-height: 1;
    display: flex; align-items: center; justify-content: center; font-family: inherit;
  }
  .counters { display: flex; gap: 12px; font-size: 13px; margin-left: auto; color: #8b97a8; }
  .counters b { font-weight: 700; }
  .counters .ok b { color: #35c46f; }
  .counters .bad b { color: #ef5350; }
  .counters .left b { color: #8fb4ff; }

  .progress { height: 4px; background: #1b212c; border-radius: 4px; overflow: hidden; margin-bottom: 14px; }
  .progress > div { height: 100%; width: 0; background: linear-gradient(90deg,#3b7bff,#35c46f); transition: width .3s; }

  .carousel {
    position: relative; width: 100%;
    height: clamp(220px, 40vh, 290px);
    perspective: 1400px; overflow: hidden;
  }
  .track { display: flex; height: 100%; transition: transform .32s cubic-bezier(.22,.61,.36,1); }
  .card { flex: 0 0 100%; height: 100%; padding: 0 3px; }
  .card-inner {
    position: relative; width: 100%; height: 100%;
    transform-style: preserve-3d;
    transition: transform .55s cubic-bezier(.4,.2,.2,1);
    cursor: pointer;
  }
  .card.flipped .card-inner { transform: rotateY(180deg); }

  .face {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 26px 20px; border-radius: 20px; text-align: center;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border: 1px solid rgba(255,255,255,.07);
    transition: border-color .3s, box-shadow .3s;
  }
  .face.front { background: linear-gradient(160deg,#1b2130,#12161e); }
  .face.back  { background: linear-gradient(160deg,#14303a,#101d24); transform: rotateY(180deg); }

  .card.ok .face { border-color: rgba(53,196,111,.55); box-shadow: 0 0 0 1px rgba(53,196,111,.35); }
  .card.bad .face { border-color: rgba(239,83,80,.55); box-shadow: 0 0 0 1px rgba(239,83,80,.35); }

  .tag {
    position: absolute; top: 14px; left: 16px;
    font-size: 10px; font-weight: 700; letter-spacing: 1.2px;
    color: #5d6b80; background: #1b2230; padding: 3px 8px; border-radius: 6px;
  }
  .card.ok .tag { color: #35c46f; background: rgba(53,196,111,.12); }
  .card.bad .tag { color: #ef5350; background: rgba(239,83,80,.12); }

  .word { font-size: clamp(19px, 5.6vw, 26px); font-weight: 700; line-height: 1.35; color: #f2f6fc; word-break: break-word; }
  .face.back .word { color: #8fe3ff; }
  .flip-hint { position: absolute; bottom: 14px; font-size: 10.5px; color: #4d5a6d; }

  .nav { display: flex; align-items: center; justify-content: center; gap: 18px; margin: 10px 0 12px; }
  .nav button {
    width: 36px; height: 36px; border-radius: 50%; border: 1px solid #232c3b;
    background: #151a23; color: #cfd7e4; font-size: 18px;
    display: flex; align-items: center; justify-content: center; font-family: inherit;
  }
  .nav button:disabled { opacity: .3; }
  .nav .pos { font-size: 13px; color: #8b97a8; font-weight: 600; min-width: 64px; text-align: center; }

  .input-area { display: flex; gap: 8px; margin-bottom: 12px; }
  .input-area input {
    flex: 1; min-width: 0; background: #151a23; border: 1.5px solid #2a3242;
    border-radius: 12px; padding: 14px; color: #e8ecf3;
    font-size: 16px; font-family: inherit; outline: none;
    transition: border-color .2s;
  }
  .input-area input:focus { border-color: #4f8cff; }
  .input-area input:disabled { opacity: .6; }
  .input-area .btn { padding: 14px 18px; }

  .feedback { font-size: 13.5px; line-height: 1.5; margin: 4px 0 10px; padding: 12px 14px; border-radius: 12px; display: none; }
  .feedback.show { display: block; }
  .feedback.ok { background: rgba(53,196,111,.1); border: 1px solid rgba(53,196,111,.3); color: #6fe0a0; }
  .feedback.bad { background: rgba(239,83,80,.1); border: 1px solid rgba(239,83,80,.3); color: #ff9a97; }
  .feedback b { color: #fff; font-weight: 700; }

  .summary { text-align: center; padding: 10px 0 20px; }
  .ring {
    width: 140px; height: 140px; border-radius: 50%; margin: 10px auto 18px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: conic-gradient(#35c46f var(--p, 0%), #1b212c 0);
    position: relative;
  }
  .ring::after { content: ''; position: absolute; inset: 10px; border-radius: 50%; background: #0e1116; }
  .ring .val { position: relative; z-index: 1; font-size: 34px; font-weight: 800; color: #fff; }
  .ring .lbl { position: relative; z-index: 1; font-size: 11px; color: #6f7c90; letter-spacing: 1px; margin-top: 2px; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  .stat { background: #151a23; border: 1px solid #232c3b; border-radius: 14px; padding: 14px; }
  .stat .v { font-size: 24px; font-weight: 800; }
  .stat .k { font-size: 11px; color: #6f7c90; margin-top: 2px; letter-spacing: .5px; }
  .stat.ok .v { color: #35c46f; }
  .stat.bad .v { color: #ef5350; }
  .summary .btn { width: 100%; margin-bottom: 8px; }

  .subtabs { display: flex; gap: 6px; background: #151a23; padding: 4px; border-radius: 12px; margin: 16px 0 14px; }
  .subtab {
    flex: 1; border: 0; background: transparent; color: #8b97a8;
    font-family: inherit; font-size: 13px; font-weight: 600;
    padding: 9px; border-radius: 9px; transition: .2s;
  }
  .subtab.active { background: #24304a; color: #fff; }

  .read-item {
    background: #141922; border: 1px solid #1f2734; border-radius: 14px;
    padding: 13px 14px; margin-bottom: 9px; display: flex; gap: 11px;
  }
  .read-item .num {
    flex: 0 0 24px; height: 24px; border-radius: 7px; background: #1e2836;
    color: #7d93b3; font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .read-item .body { flex: 1; min-width: 0; }
  .read-item .en { font-size: 14.5px; line-height: 1.45; color: #eef3fa; font-weight: 500; }
  .read-item .ru { font-size: 12.5px; line-height: 1.45; color: #6f7c90; margin-top: 5px; }
  body.hide-en .read-item .en { filter: blur(7px); opacity: .35; transition: .2s; }
  body.hide-en .read-item .en:active { filter: none; opacity: 1; }

  .build-head { display: flex; justify-content: space-between; font-size: 12px; color: #6f7c90; font-weight: 600; margin-bottom: 10px; }
  .prompt {
    background: #141922; border: 1px solid #1f2734; border-radius: 14px;
    padding: 14px; font-size: 14.5px; line-height: 1.45; color: #cfd7e4;
    margin: 0 0 12px;
  }
  .prompt::before {
    content: 'RU'; display: block; font-size: 9.5px; letter-spacing: 1.2px;
    color: #5d6b80; font-weight: 700; margin-bottom: 6px;
  }
  .answer-area {
    min-height: 74px; border: 1.5px dashed #273143; border-radius: 14px;
    padding: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start;
    margin-bottom: 12px; transition: border-color .2s;
  }
  .answer-area.ok { border-color: #35c46f; border-style: solid; background: rgba(53,196,111,.06); }
  .answer-area.bad { border-color: #ef5350; border-style: solid; background: rgba(239,83,80,.06); }
  .pool-area { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; min-height: 40px; }

  .tok {
    font-family: inherit; font-size: 14px; font-weight: 600;
    padding: 8px 12px; border-radius: 10px;
    border: 1px solid #2a3242; background: #1a212d; color: #dbe3ef;
    transition: .12s; line-height: 1.2;
  }
  .tok:active { transform: scale(.95); }
  .tok.used { opacity: .18; pointer-events: none; }
  .tok.in-answer { background: #24304a; border-color: #3b7bff; color: #fff; }
  .answer-area.ok .tok.in-answer { background: #1f4d33; border-color: #35c46f; }
  .answer-area.bad .tok.in-answer { background: #4d1f1f; border-color: #ef5350; }
</style>
</head>
<body>

<header>
  <div class="inner">
    <h1><span class="dot"></span>Тренажёр английского · Веб-разработка</h1>
    <div class="tabs">
      <button class="tab active" data-tab="vocab">Слова</button>
      <button class="tab" data-tab="topic">Тема</button>
    </div>
  </div>
</header>

<main class="wrap">

  <section id="tab-vocab">
    <div id="vocabSetup">
      <h2>Выбери колоды</h2>
      <p class="hint">60 слов · 10 колод · по 6 слов</p>
      <div class="chips" id="deckChips"></div>
      <div class="row" style="margin-bottom:16px">
        <button class="btn ghost" id="selectAll">Выбрать все</button>
        <button class="btn ghost" id="clearAll">Очистить</button>
      </div>
      <div class="field">
        <label>НАПРАВЛЕНИЕ</label>
        <div class="seg" id="dirSeg">
          <button data-dir="ru-en" class="active">RU → EN</button>
          <button data-dir="en-ru">EN → RU</button>
        </div>
      </div>
      <button class="btn primary big" id="startBtn">Начать · 6 карточек</button>
    </div>

    <div id="vocabPractice" hidden>
      <div class="topbar">
        <button class="icon-btn" id="backBtn">‹</button>
        <div class="counters">
          <span class="ok">✓ <b id="cOk">0</b></span>
          <span class="bad">✗ <b id="cBad">0</b></span>
          <span class="left">осталось <b id="cLeft">0</b></span>
        </div>
      </div>
      <div class="progress"><div id="progressBar"></div></div>

      <div class="carousel" id="carousel">
        <div class="track" id="track"></div>
      </div>

      <div class="nav">
        <button id="prevBtn">‹</button>
        <span class="pos" id="posLabel">1 / 6</span>
        <button id="nextBtn">›</button>
      </div>

      <div class="input-area">
        <input type="text" id="answerInput" placeholder="Введите перевод..." autocomplete="off" autocapitalize="off" spellcheck="false">
        <button class="btn primary" id="checkBtn">Проверить</button>
      </div>

      <div class="feedback" id="vocabFeedback"></div>

      <div class="row" id="nextRow" hidden>
        <button class="btn primary big" id="nextCardBtn">Дальше</button>
      </div>

      <p class="hint center" style="margin-top:12px">Напиши перевод и нажми «Проверить» · тап по карточке — перевернуть</p>
    </div>

    <div id="vocabSummary" hidden class="summary">
      <h2 style="margin-top:24px">Сессия завершена</h2>
      <div class="ring" id="ring">
        <span class="val" id="ringVal">0%</span>
        <span class="lbl">ЗНАЮ</span>
      </div>
      <div class="stat-grid">
        <div class="stat ok"><div class="v" id="sumOk">0</div><div class="k">ПРАВИЛЬНО</div></div>
        <div class="stat bad"><div class="v" id="sumBad">0</div><div class="k">ОШИБОК</div></div>
      </div>
      <button class="btn primary big" id="retryBadBtn">Повторить ошибки</button>
      <button class="btn ghost big" id="retryAllBtn">Пройти заново</button>
      <button class="btn ghost big" id="toSetupBtn">Выбрать колоды</button>
    </div>
  </section>

  <section id="tab-topic" hidden>
    <div class="subtabs">
      <button class="subtab active" data-sub="read">Чтение</button>
      <button class="subtab" data-sub="build">Сборка предложений</button>
    </div>

    <div id="readPane">
      <button class="btn ghost big" id="toggleEn" style="margin-bottom:14px">Скрыть английский</button>
      <div id="readList"></div>
    </div>

    <div id="buildPane" hidden>
      <div class="build-head">
        <span id="buildProgress">Предложение 1 / 11</span>
        <span id="buildScore">✓ 0 · ✗ 0</span>
      </div>
      <p class="prompt" id="buildPrompt"></p>
      <div class="answer-area" id="answerArea"></div>
      <div class="pool-area" id="poolArea"></div>
      <div class="row">
        <button class="btn ghost" id="clearBtn">Очистить</button>
        <button class="btn ghost" id="hintBtn">Подсказка</button>
        <button class="btn primary" id="checkBuildBtn">Проверить</button>
      </div>
      <div class="feedback" id="buildFeedback"></div>
    </div>
  </section>

</main>

    en: "Main tools of a web developer are JavaScript programming language, HyperText Markup Language and Cascading Style Sheets." },
  { ru: "В колледже мы изучаем, как планировать, проектировать, тестировать и поддерживать веб-сайты.",
    en: "In the college we study how to plan, design, test and maintain websites." },
  { ru: "Мы также проходим практику в IT-компаниях.", en: "We also make practice in IT companies." },
  { ru: "Там мы получаем много профессиональных навыков.", en: "We get many professional skills there." },
  { ru: "После окончания колледжа я хочу поступить в университет / открыть свой бизнес / найти хорошую работу.",
    en: "After graduating from the college I want to enter the university/ to start my own business/ to find a good job." }
];

/* ==================== УТИЛИТЫ ==================== */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function shuffleArr(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ==================== ВКЛАДКИ ==================== */
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b === btn));
    $('tab-vocab').hidden = btn.dataset.tab !== 'vocab';
    $('tab-topic').hidden = btn.dataset.tab !== 'topic';
    window.scrollTo({ top: 0 });
  });
});

/* ==================== СЛОВА ==================== */
const V = {
  selected: new Set([0]),
  dir: 'ru-en',
  queue: [],
  results: [],
  index: 0,
  checked: false
};

let startX = 0, startY = 0, dragging = false, moved = false, justSwiped = false;

function renderChips() {
  const el = $('deckChips');
  el.innerHTML = '';
  DECKS.forEach((deck, i) => {
    const b = document.createElement('button');
    b.className = 'chip' + (V.selected.has(i) ? ' active' : '');
    b.innerHTML = `<span class="n">${deck.name}</span><span class="w">${esc(deck.words[0][0])}</span>`;
    b.addEventListener('click', () => {
      V.selected.has(i) ? V.selected.delete(i) : V.selected.add(i);
      renderChips();
      updateStartBtn();
    });
    el.appendChild(b);
  });
}

function updateStartBtn() {
  const n = V.selected.size * 6;
  const btn = $('startBtn');
  btn.textContent = n === 0 ? 'Выбери хотя бы одну колоду' : `Начать · ${n} карточек`;
  btn.disabled = n === 0;
}

$('selectAll').addEventListener('click', () => {
  DECKS.forEach((_, i) => V.selected.add(i));
  renderChips(); updateStartBtn();
});
$('clearAll').addEventListener('click', () => {
  V.selected.clear();
  renderChips(); updateStartBtn();
});

document.querySelectorAll('#dirSeg button').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('#dirSeg button').forEach(x => x.classList.toggle('active', x === b));
    V.dir = b.dataset.dir;
  });
});

function buildQueue(deckIndices) {
  const q = [];
  [...deckIndices].sort((a, b) => a - b).forEach(i => {
    DECKS[i].words.forEach(([ru, en]) => q.push({ ru, en }));
  });
  return q;
}

function showVocabScreen(name) {
  $('vocabSetup').hidden = name !== 'setup';
  $('vocabPractice').hidden = name !== 'practice';
  $('vocabSummary').hidden = name !== 'summary';
}

function startPractice(queue) {
  V.queue = queue;
  V.results = new Array(queue.length).fill(null);
  V.index = 0;
  V.checked = false;
  renderCards();
  goTo(0);
  updateStats();
  showVocabScreen('practice');
  window.scrollTo({ top: 0 });
}

$('startBtn').addEventListener('click', () => {
  startPractice(buildQueue(V.selected));
});

function renderCards() {
  const track = $('track');
  track.innerHTML = '';
  const frontIsRu = V.dir === 'ru-en';

  V.queue.forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.i = i;

    const front = frontIsRu ? item.ru : item.en;
    const back  = frontIsRu ? item.en : item.ru;

    card.innerHTML = `
      <div class="card-inner">
        <div class="face front">
          <span class="tag">${frontIsRu ? 'RU' : 'EN'}</span>
          <span class="word">${esc(front)}</span>
          <span class="flip-hint">нажми, чтобы перевернуть</span>
        </div>
        <div class="face back">
          <span class="tag">${frontIsRu ? 'EN' : 'RU'}</span>
          <span class="word">${esc(back)}</span>
          <span class="flip-hint">нажми, чтобы перевернуть</span>
        </div>
      </div>`;

    card.querySelector('.card-inner').addEventListener('click', () => {
      if (justSwiped) return;
      card.classList.toggle('flipped');
    });

    track.appendChild(card);
  });

  track.style.transition = 'none';
  track.style.transform = 'translateX(0)';
  requestAnimationFrame(() => { track.style.transition = ''; });
}

function goTo(i) {
  const n = V.queue.length;
  if (i < 0) i = 0;
  if (i > n - 1) i = n - 1;
  V.index = i;
  $('track').style.transform = `translateX(${-i * 100}%)`;
  $('posLabel').textContent = `${i + 1} / ${n}`;
  $('prevBtn').disabled = i === 0;
  $('nextBtn').disabled = i === n - 1;
  resetInputFor(i);
}

function resetInputFor(i) {
  const item = V.queue[i];
  const frontIsRu = V.dir === 'ru-en';
  const state = V.results[i];

  $('answerInput').value = '';
  $('vocabFeedback').className = 'feedback';
  $('vocabFeedback').innerHTML = '';
  $('nextRow').hidden = true;

  const card = document.querySelector(`.card[data-i="${i}"]`);

  if (state) {
    card?.classList.add('flipped');
    card?.classList.remove('ok', 'bad');
    card?.classList.add(state);
    $('answerInput').disabled = true;
    $('checkBtn').disabled = true;
    if (state === 'ok') {
      showVocabFeedback('✓ Верно!', 'ok');
    } else {
      const correct = frontIsRu ? item.en : item.ru;
      showVocabFeedback(`✗ Правильный ответ: <b>${esc(correct)}</b>`, 'bad');
    }
    $('nextRow').hidden = false;
    $('nextCardBtn').textContent = i === V.queue.length - 1 ? 'Завершить' : 'Дальше';
    V.checked = true;
  } else {
    card?.classList.remove('flipped', 'ok', 'bad');
    $('answerInput').disabled = false;
    $('checkBtn').disabled = false;
    $('answerInput').placeholder = frontIsRu ? 'Введите перевод на английском...' : 'Введите перевод на русском...';
    V.checked = false;
    setTimeout(() => { if (V.index === i && !V.checked) $('answerInput').focus(); }, 80);
  }
}

$('prevBtn').addEventListener('click', () => goTo(V.index - 1));
$('nextBtn').addEventListener('click', () => goTo(V.index + 1));
$('backBtn').addEventListener('click', () => { showVocabScreen('setup'); updateStartBtn(); });

document.addEventListener('keydown', e => {
  if ($('vocabPractice').hidden) return;
  if (e.key === 'ArrowLeft') goTo(V.index - 1);
  if (e.key === 'ArrowRight') goTo(V.index + 1);
});

/* --- свайп --- */
const carousel = $('carousel');
const track = $('track');

carousel.addEventListener('touchstart', e => {
  startX = e.touches[0].clientX;
  startY = e.touches[0].clientY;
  dragging = true;
  moved = false;
  track.style.transition = 'none';
}, { passive: true });

carousel.addEventListener('touchmove', e => {
  if (!dragging) return;
  const dx = e.touches[0].clientX - startX;
  const dy = e.touches[0].clientY - startY;
  if (!moved && Math.abs(dx) > Math.abs(dy) + 4 && Math.abs(dx) > 8) moved = true;
  if (moved) {
    e.preventDefault();
    track.style.transform = `translateX(calc(${-V.index * 100}% + ${dx}px))`;
  }
}, { passive: false });

carousel.addEventListener('touchend', e => {
  if (!dragging) return;
  dragging = false;
  track.style.transition = '';
  const dx = e.changedTouches[0].clientX - startX;
  if (moved && Math.abs(dx) > 55) {
    justSwiped = true;
    setTimeout(() => { justSwiped = false; }, 320);
    goTo(dx < 0 ? V.index + 1 : V.index - 1);
  } else if (moved) {
    // был свайп, но не дотянули — просто возвращаем карту назад без сброса ввода
    track.style.transform = `translateX(${-V.index * 100}%)`;
  }
}, { passive: true });

/* --- проверка ответа в словах --- */
function checkAnswer() {
  if (V.checked) return;
  const i = V.index;
  const item = V.queue[i];
  const frontIsRu = V.dir === 'ru-en';
  const target = frontIsRu ? item.en : item.ru;
  const user = $('answerInput').value.trim();

  if (!user) {
    showVocabFeedback('Введите ответ.', 'bad');
    return;
  }

  const correct = user.toLowerCase() === target.toLowerCase();
  V.results[i] = correct ? 'ok' : 'bad';
  V.checked = true;

  const card = document.querySelector(`.card[data-i="${i}"]`);
  card?.classList.add('flipped');
  card?.classList.remove('ok', 'bad');
  card?.classList.add(correct ? 'ok' : 'bad');

  $('answerInput').disabled = true;
  $('checkBtn').disabled = true;

  if (correct) {
    showVocabFeedback('✓ Верно!', 'ok');
  } else {
    showVocabFeedback(`✗ Правильный ответ: <b>${esc(target)}</b>`, 'bad');
  }

  updateStats();
  $('nextRow').hidden = false;
  $('nextCardBtn').textContent = i === V.queue.length - 1 ? 'Завершить' : 'Дальше';
}

$('checkBtn').addEventListener('click', checkAnswer);
$('answerInput').addEventListener('keydown', e => { if (e.key === 'Enter') checkAnswer(); });

$('nextCardBtn').addEventListener('click', () => {
  const next = findNextUnanswered(V.index);
  if (next === -1) showSummary();
  else goTo(next);
});

function findNextUnanswered(from) {
  const n = V.queue.length;
  for (let off = 1; off <= n; off++) {
    const idx = (from + off) % n;
    if (V.results[idx] === null) return idx;
  }
  return -1;
}

function updateStats() {
  const ok = V.results.filter(r => r === 'ok').length;
  const bad = V.results.filter(r => r === 'bad').length;
  const total = V.queue.length;
  $('cOk').textContent = ok;
  $('cBad').textContent = bad;
  $('cLeft').textContent = total - ok - bad;
  $('progressBar').style.width = ((ok + bad) / total * 100) + '%';
}

function showSummary() {
  const ok = V.results.filter(r => r === 'ok').length;
  const bad = V.results.filter(r => r === 'bad').length;
  const pct = Math.round(ok / V.queue.length * 100);
  $('sumOk').textContent = ok;
  $('sumBad').textContent = bad;
  $('ringVal').textContent = pct + '%';
  $('ring').style.setProperty('--p', pct + '%');
  $('retryBadBtn').disabled = bad === 0;
  $('retryBadBtn').textContent = bad === 0 ? 'Ошибок нет 🎉' : `Повторить ошибки (${bad})`;
  showVocabScreen('summary');
  window.scrollTo({ top: 0 });
}

$('retryAllBtn').addEventListener('click', () => startPractice(V.queue.slice()));
$('retryBadBtn').addEventListener('click', () => {
  const wrong = V.queue.filter((_, i) => V.results[i] === 'bad');
  if (wrong.length) startPractice(wrong);
});
$('toSetupBtn').addEventListener('click', () => { showVocabScreen('setup'); updateStartBtn(); });

/* ЕДИНСТВЕННАЯ функция фидбэка для слов */
function showVocabFeedback(html, cls) {
  const f = $('vocabFeedback');
  f.innerHTML = html;
  f.className = 'feedback show ' + cls;
}

/* ==================== ТЕМА ==================== */
document.querySelectorAll('.subtab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.subtab').forEach(b => b.classList.toggle('active', b === btn));
    const sub = btn.dataset.sub;
    $('readPane').hidden = sub !== 'read';
    $('buildPane').hidden = sub !== 'build';
    if (sub === 'build') startBuild();
    window.scrollTo({ top: 0 });
  });
});

function renderRead() {
  const el = $('readList');
  el.innerHTML = '';
  SENTENCES.forEach((s, i) => {
    const d = document.createElement('div');
    d.className = 'read-item';
    d.innerHTML = `
      <div class="num">${i + 1}</div>
      <div class="body">
        <div class="en">${esc(s.en)}</div>
        <div class="ru">${esc(s.ru)}</div>
      </div>`;
    el.appendChild(d);
  });
}
$('toggleEn').addEventListener('click', () => {
  document.body.classList.toggle('hide-en');
  $('toggleEn').textContent = document.body.classList.contains('hide-en')
    ? 'Показать английский' : 'Скрыть английский';
});

const T = { idx: 0, answer: [], pool: [], locked: false, correct: 0, wrong: 0, tokens: [] };

function startBuild() {
  T.idx = 0; T.correct = 0; T.wrong = 0;
  loadSentence();
}

function loadSentence() {
  const s = SENTENCES[T.idx];
  T.tokens = s.en.split(/\s+/);
  T.answer = [];
  T.locked = false;

  let pool, guard = 0;
  do {
    pool = shuffleArr(T.tokens.map((_, i) => i));
    guard++;
  } while (guard < 20 && pool.every((v, i) => v === i) && T.tokens.length > 2);
  T.pool = pool;

  $('buildPrompt').textContent = s.ru;
  $('buildProgress').textContent = `Предложение ${T.idx + 1} / ${SENTENCES.length}`;
  $('buildFeedback').className = 'feedback';
  $('buildFeedback').innerHTML = '';
  $('checkBuildBtn').textContent = 'Проверить';
  $('answerArea').className = 'answer-area';
  updateBuildScore();
  renderBuild();
  window.scrollTo({ top: 0 });
}

function renderBuild() {
  const ansEl = $('answerArea');
  const poolEl = $('poolArea');
  ansEl.innerHTML = '';
  poolEl.innerHTML = '';

  T.answer.forEach((tokIdx, pos) => {
    const b = document.createElement('button');
    b.className = 'tok in-answer';
    b.textContent = T.tokens[tokIdx];
    b.addEventListener('click', () => {
      if (T.locked) return;
      T.answer.splice(pos, 1);
      renderBuild();
    });
    ansEl.appendChild(b);
  });

  T.pool.forEach(tokIdx => {
    const used = T.answer.includes(tokIdx);
    const b = document.createElement('button');
    b.className = 'tok' + (used ? ' used' : '');
    b.textContent = T.tokens[tokIdx];
    b.disabled = used;
    b.addEventListener('click', () => {
      if (T.locked) return;
      T.answer.push(tokIdx);
      renderBuild();
    });
    poolEl.appendChild(b);
  });
}

function updateBuildScore() {
  $('buildScore').textContent = `✓ ${T.correct} · ✗ ${T.wrong}`;
}

$('clearBtn').addEventListener('click', () => {
  if (T.locked) return;
  T.answer = [];
  renderBuild();
});

$('hintBtn').addEventListener('click', () => {
  if (T.locked) return;
  let prefix = 0;
  while (prefix < T.answer.length && T.answer[prefix] === prefix) prefix++;
  T.answer = T.answer.slice(0, prefix);
  if (T.answer.length < T.tokens.length) T.answer.push(T.answer.length);
  renderBuild();
});

/* ЕДИНСТВЕННЫЙ обработчик для кнопки "Проверить" в теме */
$('checkBuildBtn').addEventListener('click', () => {
  if (T.idx === -1) { startBuild(); return; }
  if (T.locked) { nextSentence(); return; }
  checkBuild();
});

function checkBuild() {
  if (T.answer.length !== T.tokens.length) {
    showBuildFeedback('Сначала расставь все слова.', 'bad');
    return;
  }
  const attempt = T.answer.map(i => T.tokens[i]).join(' ');
  const target = T.tokens.join(' ');
  T.locked = true;

  if (attempt === target) {
    T.correct++;
    $('answerArea').className = 'answer-area ok';
    showBuildFeedback('✓ Верно!', 'ok');
    updateBuildScore();
    setTimeout(nextSentence, 1100);
  } else {
    T.wrong++;
    $('answerArea').className = 'answer-area bad';
    showBuildFeedback(`✗ Правильный ответ: <b>${esc(target)}</b>`, 'bad');
    $('checkBuildBtn').textContent = 'Дальше';
    updateBuildScore();
  }
}

function nextSentence() {
  T.idx++;
  if (T.idx >= SENTENCES.length) {
    $('buildPrompt').textContent = 'Все 11 предложений пройдены!';
    $('answerArea').innerHTML = '';
    $('answerArea').className = 'answer-area';
    $('poolArea').innerHTML = '';
    $('buildProgress').textContent = 'Завершено';
    showBuildFeedback(`🎉 Готово! Правильно: <b>${T.correct}</b> · Ошибок: <b>${T.wrong}</b>`, 'ok');
    $('checkBuildBtn').textContent = 'Заново';
    T.locked = true;
    T.idx = -1;
    return;
  }
  loadSentence();
}

/* ЕДИНСТВЕННАЯ функция фидбэка для темы */
function showBuildFeedback(html, cls) {
  const f = $('buildFeedback');
  f.innerHTML = html;
  f.className = 'feedback show ' + cls;
}

/* ==================== СТАРТ ==================== */
renderChips();
updateStartBtn();
renderRead();
</script>
